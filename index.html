<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e4e9f0" />
    <meta name="description" content="Learn braille letters in English and Greek" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="apple-mobile-web-app-title" content="Braille Buddy" />
    <link rel="manifest" href="/manifest.json" />
    <title>Braille Buddy</title>
    <script>
      // Apply the saved or system theme before first paint. Keep in sync with
      // getInitialTheme in src/components/ThemeSwitcher/ThemeSwitcher.tsx.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (!/^(light|dark|high-visibility)$/.test(theme || "")) {
          var mq = window.matchMedia;
          theme =
            mq && mq("(prefers-contrast: more)").matches
              ? "high-visibility"
              : mq && mq("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        var root = document.documentElement;
        root.dataset.theme = theme;

        // Match the browser/status bar to the page colour (--page in
        // index.css), also when the theme switcher changes the theme later.
        var colors = { light: "#e4e9f0", dark: "#0f1525", "high-visibility": "#ffd60a" };
        var meta = document.querySelector('meta[name="theme-color"]');
        var syncThemeColor = function () {
          var color = colors[root.dataset.theme];
          if (meta && color) meta.setAttribute("content", color);
        };
        syncThemeColor();
        if (window.MutationObserver) {
          new MutationObserver(syncThemeColor).observe(root, {
            attributes: true,
            attributeFilter: ["data-theme"],
          });
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
